services:
  # ============================================================================
  # NGINX PROXY MANAGER & BASE DE DATOS DEDICADA (MariaDB)
  # ============================================================================
  npm-db:
    image: jc21/mariadb-aria:latest
    container_name: npm-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NPM_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${NPM_DB_NAME}
      MYSQL_USER: ${NPM_DB_USER}
      MYSQL_PASSWORD: ${NPM_DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - npm_db_data:/var/lib/mysql
    networks:
      - npm-net
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "${NPM_HTTP_PORT}:80"
      - "${NPM_ADMIN_PORT}:81"
      - "${NPM_HTTPS_PORT}:443"
    environment:
      DB_MYSQL_HOST: npm-db
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: ${NPM_DB_USER}
      DB_MYSQL_PASSWORD: ${NPM_DB_PASSWORD}
      DB_MYSQL_NAME: ${NPM_DB_NAME}
      DISABLE_IPV6: "true"
      INITIAL_ADMIN_EMAIL: ${NPM_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${NPM_ADMIN_PASSWORD}
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    depends_on:
      npm-db:
        condition: service_healthy
    networks:
      - npm-net
      - app-net

  # ============================================================================
  # APACHE GUACAMOLE & BASE DE DATOS DEDICADA (PostgreSQL)
  # ============================================================================
  guacamole-db:
    image: postgres:15-alpine
    container_name: guacamole-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GUAC_DB_NAME}
      POSTGRES_USER: ${GUAC_DB_USER}
      POSTGRES_PASSWORD: ${GUAC_DB_PASSWORD}
    volumes:
      - guac_db_data:/var/lib/postgresql/data
      - ./guacamole/01-initdb.sql:/docker-entrypoint-initdb.d/01-initdb.sql:ro
    networks:
      - guac-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GUAC_DB_USER} -d ${GUAC_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  guacd:
    image: guacamole/guacd:latest
    container_name: guacamole-daemon
    restart: unless-stopped
    volumes:
      - ./data/guacamole/recordings:/var/lib/guacamole/recordings
    networks:
      - guac-net

  guacamole:
    image: guacamole/guacamole:latest
    container_name: apache-guacamole
    restart: unless-stopped
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      POSTGRESQL_HOSTNAME: guacamole-db
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: ${GUAC_DB_NAME}
      POSTGRESQL_USERNAME: ${GUAC_DB_USER}
      POSTGRESQL_PASSWORD: ${GUAC_DB_PASSWORD}
      WEBAPP_CONTEXT: ${GUACAMOLE_WEBAPP_CONTEXT}
      REMOTE_IP_VALVE_ENABLED: "true"
      INCUS_HOST: ${INCUS_HOST}
      INCUS_SSH_USER: ${INCUS_SSH_USER}
      INCUS_SSH_PASSWORD: ${INCUS_SSH_PASSWORD}
      INCUS_TIMEOUT_MINUTES: ${INCUS_TIMEOUT_MINUTES}
      INCUS_BOOT_DELAY_MS: ${INCUS_BOOT_DELAY_MS}
    volumes:
      - ./data/guacamole/recordings:/var/lib/guacamole/recordings
      - ./data/guacamole/extensions:/etc/guacamole/extensions:ro
      - ./data/guacamole/laboratorio-ansible.pem:/etc/guacamole/laboratorio-ansible.pem:ro
    depends_on:
      guacamole-db:
        condition: service_healthy
      guacd:
        condition: service_started
    networks:
      - guac-net
      - app-net

# ============================================================================
# REDES AISLADAS
# ============================================================================
networks:
  npm-net:
    driver: bridge
  guac-net:
    driver: bridge
  app-net:
    driver: bridge

# ============================================================================
# VOLÚMENES NOMBRADOS (GESTIONADOS POR DOCKER)
# ============================================================================
volumes:
  npm_db_data:
  npm_data:
  npm_letsencrypt:
  guac_db_data:
